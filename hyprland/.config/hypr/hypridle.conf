general {
    # lock_cmd = pgrep -x hyprlock >/dev/null || hyprlock
    # before_sleep_cmd = loginctl lock-session
    # Turn displays off two seconds after Hyprlock confirms the session is locked.
    on_lock_cmd = sleep 2 && pgrep -x hyprlock >/dev/null && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    inhibit_sleep = 2
}

# Input while Hyprlock is active wakes the displays without affecting idle timers.
listener {
    timeout = 1
    on-resume = pgrep -x hyprlock >/dev/null && hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_inhibit = true
}

# Five minutes: lower panel brightness while preserving the previous value.
listener {
    timeout = 300
    on-timeout = command -v brightnessctl >/dev/null 2>&1 && brightnessctl -s set 20%
    on-resume = command -v brightnessctl >/dev/null 2>&1 && brightnessctl -r
}

# Ten minutes: lock the session.
# listener {
#     timeout = 600
#     on-timeout = loginctl lock-session
# }

# Eleven minutes: switch displays off after the lock listener has fired.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
