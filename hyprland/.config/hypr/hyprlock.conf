general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
    screencopy_mode = 0
    fail_timeout = 2000
}

animations {
    enabled = true
}

bezier = lockEase, 0.05, 0.70, 0.10, 1.00

animation = fadeIn, 1, 2.5, lockEase
animation = fadeOut, 1, 2.0, lockEase
animation = inputFieldFade, 1, 2.5, lockEase
animation = inputFieldDots, 1, 2.5, lockEase
animation = inputFieldColors, 1, 2.5, lockEase

background {
    monitor =
    path = screenshot
    color = rgba(1e1e2eff)
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.90
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.10
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(1e1e2e73)
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=zh_TW.UTF-8 date '+%Y年%m月%d日 %A'
    color = rgba(a6adc8ff)
    font_size = 17
    font_family = Noto Sans CJK TC
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(1e1e2e66)
    position = 0, 105
    halign = center
    valign = center
}

label {
    monitor =
    text = $DESC
    color = rgba(cdd6f4ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -65
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(5c9cf5dc)
    inner_color = rgba(313244e6)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(5c9cf5e6)
    fail_color = rgba(f38ba8e6)
    capslock_color = rgba(fab387e6)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    rounding = 16
    placeholder_text = <i>輸入密碼…</i>
    fail_text = <i>$FAIL</i>
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(1e1e2e73)
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(a6adc8d9)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 35
    halign = center
    valign = bottom
}
