[main]
include=~/.config/fuzzel/colors.ini

namespace=launcher
launch-prefix=uwsm app --
layer=overlay
anchor=center
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

font=JetBrainsMono Nerd Font:size=14,Noto Sans CJK TC:size=14
use-bold=yes
dpi-aware=auto

prompt="  "
placeholder=搜尋應用程式…
password-character=●

icons-enabled=yes
match-mode=fzf
sort-result=yes
match-counter=yes
show-actions=yes
filter-desktop=no
list-executables-in-path=no

terminal=ghostty -e {cmd}

lines=10
width=48
tabs=4

horizontal-pad=24
vertical-pad=14
inner-pad=8

line-height=26
letter-spacing=0

minimal-lines=yes
image-size-ratio=0.35

enable-mouse=yes

[dmenu]
mode=text
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+c Control+g
execute=Return KP_Enter Control+y
execute-or-next=Tab
execute-input=Shift+Return Shift+KP_Enter

prev=Up Control+p
next=Down Control+n
prev-with-wrap=ISO_Left_Tab
next-with-wrap=Control+j

cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e

delete-prev=BackSpace Control+h
delete-prev-word=Control+BackSpace Control+w
delete-next=Delete
delete-line-backward=Control+u
delete-line-forward=Control+k

clipboard-paste=Control+v XF86Paste
primary-paste=Shift+Insert Shift+KP_Insert
