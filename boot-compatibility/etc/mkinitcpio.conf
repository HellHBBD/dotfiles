# vim:set ft=sh:
# Shared mkinitcpio configuration for portable UEFI installations.

MODULES=()
BINARIES=()
FILES=()

# Keep microcode before autodetect so the regular image contains the installed
# Intel and AMD updates. The fallback preset below omits autodetect entirely.
HOOKS=(base udev microcode autodetect modconf kms keyboard keymap consolefont block filesystems fsck)
